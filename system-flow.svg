<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 515" role="img" aria-labelledby="title desc">
  <title id="title">Bedtime story system flow</title>
  <desc id="desc">The storyteller receives the user's idea and optional age. The LLM judge reviews the draft against the original request. If needed, the storyteller revises once and the judge reviews again. The CLI returns either an approved story or a request to try again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="800" height="515" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M400 60 V106"/>
    <path d="M400 148 V194"/>
    <path d="M300 39 H125 V215 H280"/>
    <path d="M315 236 V252 H167 V451"/>
    <path d="M400 236 V282"/>
    <path d="M400 324 V370"/>
    <path d="M280 391 H233 V451"/>
    <path d="M520 391 H633 V451"/>
    <path d="M47 472 H24 V30 H300"/>
    <path d="M753 472 H776 V39 H500"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5">
    <rect x="300" y="18" width="200" height="42" rx="8" fill="#e0f2fe"/>
    <rect x="280" y="106" width="240" height="42" rx="8" fill="#fff"/>
    <rect x="280" y="194" width="240" height="42" rx="8" fill="#eef2ff"/>
    <rect x="255" y="282" width="290" height="42" rx="8" fill="#fff"/>
    <rect x="280" y="370" width="240" height="42" rx="8" fill="#eef2ff"/>
    <rect x="47" y="451" width="240" height="42" rx="8" fill="#dcfce7"/>
    <rect x="513" y="451" width="240" height="42" rx="8" fill="#fef3c7"/>
  </g>
  <g fill="#0f172a" font-family="system-ui, sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <text x="400" y="45">User</text>
    <text x="400" y="133">Storyteller</text>
    <text x="400" y="221">LLM judge</text>
    <text x="400" y="309">Storyteller revises from feedback</text>
    <text x="400" y="397">LLM judge reviews revision</text>
    <text x="167" y="478">CLI prints final story</text>
    <text x="633" y="478">CLI asks user to try again</text>
  </g>
  <g fill="#334155" font-family="system-ui, sans-serif" font-size="14">
    <text x="412" y="87">Story idea and optional age</text>
    <text x="412" y="175">Draft</text>
    <text x="137" y="131">Original request</text>
    <text x="154" y="272" text-anchor="end">Draft approved</text>
    <text x="412" y="263">Draft needs work</text>
    <text x="412" y="351">Revised story</text>
    <text x="222" y="430" text-anchor="end">Revision approved</text>
    <text x="622" y="430" text-anchor="end">Revision fails review</text>
  </g>
</svg>
